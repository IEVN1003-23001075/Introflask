
{% extends "layout.html" %}

{% block container %}

<div class="col-12">

    <h1>Operaciones básicas</h1>

    <form action="{{ url_for('operasbas') }}" method="POST">

        <div class="mb-3">
            <label for="n1" class="form-label">
                Número 1:
            </label>

            <input
                type="number"
                step="any"
                class="form-control"
                id="n1"
                name="n1"
                value="{{ n1 }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="n2" class="form-label">
                Número 2:
            </label>

            <input
                type="number"
                step="any"
                class="form-control"
                id="n2"
                name="n2"
                value="{{ n2 }}"
                required
            >
        </div>

        <p>Seleccione la operación:</p>

        <div class="form-check">
            <input
                class="form-check-input"
                type="radio"
                name="operacion"
                id="sumar"
                value="sumar"
                {% if operacion == 'sumar' %}checked{% endif %}
            >

            <label class="form-check-label" for="sumar">
                Sumar
            </label>
        </div>

        <div class="form-check">
            <input
                class="form-check-input"
                type="radio"
                name="operacion"
                id="restar"
                value="restar"
                {% if operacion == 'restar' %}checked{% endif %}
            >

            <label class="form-check-label" for="restar">
                Restar
            </label>
        </div>

        <div class="form-check mb-3">
            <input
                class="form-check-input"
                type="radio"
                name="operacion"
                id="multiplicar"
                value="multiplicar"
                {% if operacion == 'multiplicar' %}checked{% endif %}
            >

            <label class="form-check-label" for="multiplicar">
                Multiplicar
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            Calcular
        </button>

    </form>

    {% if res is not none %}
        <div class="alert alert-success mt-3">
            Resultado: {{ "%.2f"|format(res) }}
        </div>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
    {% endif %}

</div>

{% endblock %}
